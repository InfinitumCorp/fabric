<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>FabriC++ · Back to the app</title>
<style>:root{--paper:#fff;--ink:#111820;--muted:#52606b;--line:#d6dce1;--accent:#2454dd;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--paper);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55}
main{max-width:520px;margin:0 auto;padding:64px 24px}
h1{font-size:28px;font-weight:400;margin:0 0 12px}
p{color:var(--muted);margin:0 0 24px}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid var(--ink);color:var(--ink);text-decoration:none}
.btn:hover,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}</style>
</head>
<body>
<main>
<h1>FabriC++</h1>
<p id="msg">Returning you to the FabriC++ app.</p>
<a class="btn" id="open" href="infinitumfabric-app://billing/return">Open FabriC++</a>
</main>
<script src="/billing/rn.js" defer></script>
</body>
</html>
