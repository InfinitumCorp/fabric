name: core
on:
  push:
    paths: ["core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
