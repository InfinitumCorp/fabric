# coturn for FabriC++ calls. The relay signs short-lived logins with the same secret
# (FABRIC_TURN_SECRET); nothing else can use this server.
#
#   FABRIC_TURN_URLS=turn:turn.example.com:3478?transport=udp,turn:turn.example.com:3478?transport=tcp,turns:turn.example.com:443?transport=tcp
#   FABRIC_TURN_SECRET=<the static-auth-secret below>
#
# turns: on 443 gets through networks that only allow HTTPS. Media through TURN is still
# encrypted end to end (DTLS-SRTP plus frame encryption); TURN sees only packets and addresses.

realm=turn.example.com
listening-port=3478
tls-listening-port=443
cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem

# logins signed by the relay: "<expiry>:<random id>", HMAC-SHA1 with this secret
use-auth-secret
static-auth-secret=CHANGE-ME-to-a-long-random-value

# behind NAT: external-ip=<public ip>/<private ip>
min-port=49160
max-port=49999
fingerprint
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
stale-nonce=600
user-quota=12
total-quota=1200

# Don't let anyone use TURN to reach the operator's own network (SSRF through relayed
# allocations). Allow the SFU's address explicitly if it sits in one of these ranges:
#   allowed-peer-ip=10.0.0.5
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-loopback-peers

# no per-user logs of who called whom; coturn logs allocations by the random login id
log-file=stdout
simple-log
