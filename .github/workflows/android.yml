name: Android

on:
  push:
  pull_request:

jobs:
  debug-apks:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Self-hosted runners set ANDROID_HOME but often ship no cmdline-tools,
      # so sdkmanager is missing and the job dies with exit 127.
      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-}"
          if [ -z "$SDK" ] || { [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ] && [ ! -w "$SDK" ]; }; then
            SDK="${RUNNER_TEMP}/android-sdk"
          fi
          mkdir -p "$SDK/cmdline-tools"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/cmdtools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q "$tmp/cmdtools.zip" -d "$tmp"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$tmp/cmdline-tools" "$SDK/cmdline-tools/latest"
            rm -rf "$tmp"
          fi
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$SDK" --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.1"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Lint, unit test, assemble debug APKs
        working-directory: android
        run: ./gradlew lint test assembleDebug assembleDebugAndroidTest --stacktrace

      - name: SHA256 of debug APKs
        run: sha256sum android/app/build/outputs/apk/debug/*.apk android/app/build/outputs/apk/androidTest/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fabric-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: fabric-androidTest-debug
          path: android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
