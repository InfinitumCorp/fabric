plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.fabricmatrix'
version = '0.1.0'

android {
  namespace "expo.modules.fabricmatrix"
  defaultConfig {
    consumerProguardFiles "consumer-rules.pro"
    versionCode 1
    versionName "0.1.0"
    minSdkVersion 28
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  lintOptions { abortOnError false }
}

dependencies {
  // Pinned: built from matrix-rust-sdk 8de215a0 (sdk-v26.10.23). See docs/native-versions.md.
  implementation "org.matrix.rustcomponents:sdk-android:26.10.23"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
  androidTestImplementation "androidx.test:runner:1.6.2"
  androidTestImplementation "androidx.test.ext:junit:1.2.1"
  androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
}
