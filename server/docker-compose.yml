# Local development only. Not for deployment.
# Synapse shares the database container's network namespace, so Synapse reaches Postgres at 127.0.0.1
# without Docker's embedded DNS (which needs iptables; the box's dockerd runs with --iptables=false).
# Only 127.0.0.1:8008 is published to the host. Postgres is not published.
name: fabric-local
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${FABRIC_DB_PASSWORD:?run ./configure.sh first}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes: ["./pgdata:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:8008:8008"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -h 127.0.0.1"]
      interval: 2s
      retries: 30
  synapse:
    image: matrixdotorg/synapse:v1.164.2
    network_mode: "service:db"
    depends_on:
      db: { condition: service_healthy }
    volumes: ["./data:/data"]
